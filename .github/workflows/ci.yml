name: CI

# Runs on every push to master and on every pull request.
# Validates that the codebase typechecks, tests pass, and the build succeeds
# before anything can be merged. This is the quality gate that was missing —
# previously code could be merged with zero automated validation.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install
      - name: Install server deps
        run: cd server && bun install
      - name: Install client deps
        run: cd client && bun install
      - name: Generate Prisma client
        run: cd server && bunx prisma generate
      - name: Typecheck
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install
      - name: Install server deps
        run: cd server && bun install
      - name: Install client deps
        run: cd client && bun install
      - name: Generate Prisma client
        run: cd server && bunx prisma generate
      - name: Lint
        run: bun run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install
      - name: Install server deps
        run: cd server && bun install
      - name: Install client deps
        run: cd client && bun install
      - name: Generate Prisma client
        run: cd server && bunx prisma generate
      - name: Run server tests
        run: cd server && bun test
      - name: Run client tests
        run: cd client && bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install
      - name: Install server deps
        run: cd server && bun install
      - name: Install client deps
        run: cd client && bun install
      - name: Generate Prisma client
        run: cd server && bunx prisma generate
      - name: Build server
        run: bun run build:server
      - name: Build client
        run: bun run build:client
